<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Map Editor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="styles.css?v=20261020-map-update-2" />
</head>
<body>
  <button id="sidebarRevealBtn" class="edge-reveal-trigger sidebar-reveal-trigger" type="button" aria-label="Show side navigation">
    <i class="fa-solid fa-angles-right"></i>
  </button>
  <button id="topRevealBtn" class="edge-reveal-trigger top-reveal-trigger" type="button" aria-label="Show top navigation">
    <i class="fa-solid fa-angles-down"></i>
  </button>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="panel-header">
        <h1>Map Editor</h1>
        <div class="panel-header-actions">
          <button id="toggleSidebarBtn" class="panel-toggle" type="button" aria-label="Hide side navigation">
            <i class="fa-solid fa-angles-left"></i>
          </button>
          <button id="serverSaveBtn" class="panel-save-btn" type="button" aria-label="Save to server as map.json" title="Save to server as map.json (Ctrl+S)">
            <i class="fa-solid fa-floppy-disk"></i>
            <span>Save</span>
          </button>
        </div>
      </div>

      <div class="tool-group collapsible-panel" id="buildingsPanel">
        <div class="tool-group-header">
          <h3>Buildings</h3>
          <button id="buildingsCollapseBtn" class="collapse-toggle" type="button" aria-label="Collapse buildings panel" aria-expanded="true" title="Collapse buildings panel">
            <i class="fa-solid fa-chevron-up"></i>
          </button>
        </div>
        <div class="tool-group-body" id="buildingListContainer">
          <ul id="buildingList" class="building-list"></ul>
        </div>
      </div>

      <div class="tool-group">
        <h3>Quick actions</h3>
        <label class="toggle-row">
          <input id="gridSnapToggle" type="checkbox" />
          <span>Snap to grid</span>
        </label>
        <label>
          Active floor
          <select id="globalFloorSelect">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </label>
        <label>
          Map width (px)
          <input id="mapWidthInput" type="number" step="any" inputmode="decimal" value="1920" />
        </label>
        <label>
          Map height (px)
          <input id="mapHeightInput" type="number" step="any" inputmode="decimal" value="1080" />
        </label>
        <div class="stacked-btns">
          <button id="applyMapSizeBtn" class="full-width">Apply map size</button>
          <button id="toggleJunctionsBtn" class="tool-btn full-width" type="button" aria-label="Hide junctions and connections" aria-pressed="false">Hide junctions &amp; connections</button>
          <button id="resetBtn">Reset canvas</button>
        </div>
      </div>

      <div class="tool-group property-panel">
        <h3>Properties</h3>
        <label>
          Label<br>
          <textarea id="labelInput" rows="2" placeholder="Building name"></textarea>
        </label>
        <label>
          Text size (px)
          <input id="labelSizeInput" type="number" max="48" step="any" inputmode="decimal" value="14" />
        </label>
        <label>
          Font color
          <input id="fontColorInput" type="color" value="#000000" />
        </label>
        <div class="group-field-wrap">
          <div class="group-field-label-row">
            <label for="groupInput">Group</label>
            <span id="groupHelpBtn" tabindex="0" role="note" aria-label="Group help" title="Define a group name and add parentheses specifying the label text for path selection.">
              <i class="fa-solid fa-circle-info"></i>
            </span>
          </div>
          <div class="group-field-input-row">
            <input id="groupInput" type="text" placeholder="e.g. cr_female (Female Restroom)" />
          </div>
        </div>
        <label>
          Tags (rooms only)
          <input id="tagsInput" type="text" placeholder="e.g. restroom, cr, comfort room" />
        </label>
        <label class="toggle-row" style="display:flex; align-items:center; justify-content:space-between; width:100%;">
          <span>Disable destination</span>
          <input id="disableDestinationToggle" type="checkbox" style="width:18px; height:18px; margin:0;" />
        </label>
        <label class="toggle-row" style="display:flex; align-items:center; justify-content:space-between; width:100%;" title="Hides the item on the public map but keeps the node active for pathfinding">
          <span>Remove display</span>
          <input id="hideDisplayToggle" type="checkbox" style="width:18px; height:18px; margin:0;" />
        </label>
        <label class="toggle-row" style="display:flex; align-items:center; justify-content:space-between; width:100%;" title="Marks this node as a connector between floors. Pathfinding shows an up/down triangle on it where the route changes floors.">
          <span>Floor connector</span>
          <input id="floorConnectorToggle" type="checkbox" style="width:18px; height:18px; margin:0;" />
        </label>
        
        <label>
          Building
          <select id="nodeBuildingSelect"></select>
        </label>
        <label>
          Floors
          <input id="buildingFloorCountInput" type="number" min="1" max="20" step="1" inputmode="numeric" value="1" />
        </label>
        <label>
          Color
          <input id="typeColorInput" type="color" value="#7bb7ff" />
        </label>
        <label>
          Width (px)
          <input id="buildingWidthInput" type="number" step="any" inputmode="decimal" value="220" />
        </label>
        <label>
          Height (px)
          <input id="buildingHeightInput" type="number" step="any" inputmode="decimal" value="180" />
        </label>
        <div id="junctionCoordinateGroup" style="display:none;">
          <label>
            X position (px)
            <input id="junctionXInput" type="number" step="1" inputmode="decimal" value="0" />
          </label>
          <label>
            Y position (px)
            <input id="junctionYInput" type="number" step="1" inputmode="decimal" value="0" />
          </label>
        </div>
        <label>
          Floor
          <select id="floorInput">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </label>
        <label>
          Stair design
          <select id="stairDesignInput">
            <option value="horizontal">Horizontal</option>
            <option value="vertical">Vertical</option>
          </select>
        </label>
        <label>
          Line width (px)
          <input id="lineThicknessInput" type="number" max="50" step="any" inputmode="decimal" value="2" />
        </label>
        <label class="toggle-row" style="display:flex; align-items:center; justify-content:space-between; width:100%;">
          <span>Multi junction connection</span>
          <input id="multiJunctionToggle" type="checkbox" style="width:18px; height:18px; margin:0;" />
        </label>
        <div class="inline-row">
          <button id="moveToFrontBtn" type="button">Move to front</button>
          <button id="moveToBackBtn" type="button">Move to back</button>
        </div>
        <div class="inline-row">
          <button id="applyPropsBtn">Apply</button>
          <button id="deleteSelectedBtn" class="danger">Delete</button>
        </div>
      </div>

    </aside>

    <main class="workspace">
      <div class="canvas-toolbar">
        <div class="mode-toolbar">
          <div class="compact-tool-buttons">
            <button class="tool-btn active" data-mode="select" title="Select tool (S)">Select</button>
            <!-- <button class="tool-btn" data-mode="select-building">Select building</button>
            <button class="tool-btn" data-mode="select-room">Select room</button>
            <button class="tool-btn" data-mode="select-junction">Select junction</button> -->
            <button class="tool-btn" id="addBuildingBtn" data-mode="add-building" title="Add building (B)">Add building</button>
            <button class="tool-btn" data-mode="add-room" title="Add room (R)">Add room</button>
            <button class="tool-btn" data-mode="add-junction" title="Add junction (J)">Add junction</button>
            <button class="tool-btn" data-mode="add-stair" title="Add stair (F)">Add stair</button>
            <button class="tool-btn" data-mode="add-line" title="Add line (L)">Add line</button>
            <button class="tool-btn" data-mode="connect" title="Connect (C)">Connect</button>
            <button class="tool-btn danger" data-mode="delete" title="Delete selected">Delete</button>
            <button id="duplicateNodeBtn" class="tool-btn" aria-label="Duplicate selected" title="Duplicate selected"><i class="fa-solid fa-copy"></i></button>
            <button id="exportJsonBtn" class="tool-btn" aria-label="Export JSON" title="Export JSON"><i class="fa-solid fa-upload"></i></button>
            <button id="importJsonBtn" class="tool-btn" aria-label="Import JSON" title="Import JSON"><i class="fa-solid fa-download"></i></button>
            <button id="undoBtn" class="tool-btn" aria-label="Undo" title="Undo (Ctrl+Z)"><i class="fa-solid fa-arrow-rotate-left"></i></button>
            <button id="redoBtn" class="tool-btn" aria-label="Redo" title="Redo (Ctrl+Y)"><i class="fa-solid fa-arrow-rotate-right"></i></button>
          </div>
        </div>

        <div class="zoom-controls">
          <button id="toggleTopNavBtn" class="toolbar-toggle" type="button" aria-label="Hide top navigation">
            <i class="fa-solid fa-eye-slash"></i>
          </button>
          <button id="zoomOutBtn">−</button>
          <input id="zoomLabel" type="text" value="100%" inputmode="numeric" aria-label="Zoom percentage" />
          <button id="zoomInBtn">+</button>
        </div>
      </div>

      <div class="canvas-wrap">
        <svg id="mapCanvas" viewBox="0 0 2200 1700" preserveAspectRatio="xMidYMid meet">
          <defs>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,.18)"/>
            </filter>
          </defs>
          <g id="axisLayer"></g>
          <g id="edgeLayer"></g>
          <g id="nodeLayer"></g>
        </svg>
      </div>
    </main>
  </div>

  <script src="editor.js?v=20261020-map-update-2"></script>
</body>
</html>
