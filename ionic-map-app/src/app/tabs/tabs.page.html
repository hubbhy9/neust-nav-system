<ion-tabs>
  <ion-router-outlet></ion-router-outlet>

  <ion-tab-bar slot="bottom">
    @for (tab of tabs; track tab.id) {
      <ion-tab-button [tab]="tab.id" [href]="tab.route">
        <ion-icon [name]="tab.icon"></ion-icon>
        <span class="tab-label">{{ tab.label }}</span>
      </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
